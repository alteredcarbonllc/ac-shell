name: Shell offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  posix-shell:
    name: Offline ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n ac-shell-setup.sh
          sh -n test-shell.sh
          sh -n lab/run-local-user-lab.sh
          sh -n lab/ac-shell-vm-lab.sh
          sh test-shell.sh
      - name: Three-language documentation and relative links
        shell: bash
        run: python3 test-docs.py
